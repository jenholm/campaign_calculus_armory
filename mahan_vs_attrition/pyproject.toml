[project]
name = "mahan-vs-attrition"
version = "0.1.0"
description = "Decisive battle or strategic exhaustion? Testing war termination mechanisms from 1816 to present."
readme = "README.md"
authors = [
    { name = "Jake Enholm", email = "jake@enholm.net" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.4",
    "lxml>=6.1.1",
    "numpy>=2.3.0",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.26.7",
    "matplotlib>=3.11.0",
    "plotly>=6.8.0",
    "altair>=6.2.1",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "lifelines>=0.30.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "streamlit>=1.45.0",
]

[project.scripts]
mahan-vs-attrition = "mahan_vs_attrition.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "jupyter>=1.1.1",
    "mypy>=2.1.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
