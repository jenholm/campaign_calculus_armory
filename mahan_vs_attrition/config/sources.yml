cow_war:
  name: "Correlates of War War Data"
  type: "download"
  period: "1816-2007"
  priority: 1
  license_notes: "Check source terms"
  local_path: "data/raw/cow_war/"
  required_fields:
    - war_id
    - war_name
    - start_date
    - end_date
    - participants
    - outcome

